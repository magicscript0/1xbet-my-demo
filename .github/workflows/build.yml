name: Build and Sign APK

on:
  push:
    branches: [ "main", "arena/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Apktool and Uber-APK-Signer
        run: |
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b . -o app-unsigned.apk

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar --apk app-unsigned.apk --out output

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-APK
          path: output/*.apk
